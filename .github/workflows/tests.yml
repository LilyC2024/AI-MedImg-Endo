name: Endoscopy research checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      LANGCHAIN_TRACING_V2: 'false'
      LANGSMITH_TRACING: 'false'
      OLLAMA_NO_CLOUD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install explicit CPU training/inference environment
        run: |
          python -m pip install torch==2.14.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[ml,ui,dev]"
          python -m pip check
      - name: Check source and docs
        run: |
          python -m compileall -q src tests app.py scripts
          python scripts/check_docs.py
          python scripts/generate_api_docs.py --check
          python scripts/check_publication.py
          python -m ruff check src tests app.py --select F,I
      - name: Install pinned quality tools
        run: python -m pip install mypy==2.4.0 pytest-cov==7.1.0
      - name: Type-check exchange, workspace and inference
        run: python -m mypy
      - name: Offline tests including actual tiny artificial train/export, coverage floor
        run: python -m pytest -q --cov --cov-report=term
      - name: Audit installed dependencies and write SBOM
        if: runner.os == 'Linux'
        run: |
          python -m pip install --upgrade pip setuptools filelock
          python -m pip install pip-audit==2.10.1 cyclonedx-bom==7.5.0
          python -m pip_audit --skip-editable --local
          cyclonedx-py environment -o sbom.cdx.json
      - name: Upload SBOM
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: endo-sbom
          path: sbom.cdx.json
          retention-days: 30
      - name: Actual non-ML artificial exchange
        run: python -m endo.cli demo --output artifacts/ci-fixture
      # No research data, clinical accounts, model service, medical approvals or artifact upload.
