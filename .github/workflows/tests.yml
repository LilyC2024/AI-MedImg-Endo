name: Endoscopy research checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      LANGCHAIN_TRACING_V2: 'false'
      LANGSMITH_TRACING: 'false'
      OLLAMA_NO_CLOUD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install explicit CPU training/inference environment
        run: |
          python -m pip install torch==2.14.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[ml,ui,dev]"
          python -m pip check
      - name: Check source and docs
        run: |
          python -m compileall -q src tests app.py scripts
          python scripts/check_docs.py
          python -m ruff check src tests app.py --select F,I
      - name: Offline tests including actual tiny artificial train/export
        run: python -m pytest -q
      - name: Actual non-ML artificial exchange
        run: python -m endo.cli demo --output artifacts/ci-fixture
      # No research data, clinical accounts, model service, medical approvals or artifact upload.
