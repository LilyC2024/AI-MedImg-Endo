[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lovisa-endo"
version = "0.1.0"
description = "Local image-first polyp candidate research assistant and LOVISA companion"
requires-python = ">=3.10"
dependencies = ["numpy>=2,<3", "pillow>=10,<14", "pydantic>=2.10,<3"]

[project.optional-dependencies]
ml = ["torch>=2.5,<3", "onnx>=1.17,<2", "onnxruntime>=1.20,<2", "onnxscript>=0.3,<1"]
npu = ["openvino>=2025.0,<2027"]
ui = ["streamlit>=1.65,<2"]
dev = ["pytest>=8,<10", "ruff>=0.9"]

[project.scripts]
lovisa-endo = "endo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint.isort]
known-first-party = ["endo", "endo_contracts"]

[tool.mypy]
# Typed gate on exchange export, workspaces and inference. The vendored
# endo_contracts module is followed silently: changing it needs a synchronized
# LOVISA contract update (one known Literal/str finding in Bundle.schema_version).
files = ["src/endo/exchange.py", "src/endo/workspace.py", "src/endo/inference.py"]
ignore_missing_imports = true
follow_imports = "silent"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
# Measured 74.6% on 24 October 2026.
fail_under = 70
